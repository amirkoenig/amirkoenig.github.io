<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Amir König</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Cutive+Mono&family=Instrument+Serif&display=swap">
  <style>
    :root { --klein: #1d3fbf; --cream: #f4efe8; --pink: #ffb3cd; --orange: #fc4109; --ink: #1f1e1d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 72px clamp(16px, 5vw, 64px);
      background: var(--klein); color: var(--cream);
      font: 300 16px/1.5 "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    }
    p { margin: 0; }
    .h { font-size: 18px; line-height: 1; font-weight: 700; }
    .h span { font-family: "Cutive Mono", ui-monospace, monospace; font-weight: 400; color: var(--orange); margin-right: .3em; }
    .big { font: 400 clamp(120px, 26vw, 360px)/.86 "Instrument Serif", Georgia, serif; letter-spacing: -.03em; color: var(--pink); margin: 3vh 0 4vh -.04em; }
    .big i { color: var(--orange); font-style: normal; }
    .line { font-size: clamp(24px, 3.2vw, 44px); letter-spacing: -.015em; max-width: 20em; }
    a {
      display: inline-flex; align-items: center; height: 40px; padding: 0 18px; margin-top: 36px; align-self: flex-start;
      border-radius: 999px; background: var(--pink); color: var(--ink);
      font-weight: 700; font-size: 14px; text-decoration: none;
    }
    a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  </style>
</head>
<body>
  <p class="h"><span>##</span>not found</p>
  <p class="big">404<i>.</i></p>
  <p class="line">This file doesn’t exist. The rest of the site does.</p>
  <a href="/">Back to the start</a>
</body>
</html>
